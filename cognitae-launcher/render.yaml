services:
  - type: web
    name: cognitae-launcher
    runtime: python
    rootDir: cognitae-launcher
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in Render dashboard (optional — users can use BYOK)
    autoDeploy: true
